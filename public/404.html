<body><h1>404</h1><p id="t">This page doesn’t exist or has been moved.</p><a id="b" href="/en/">Back to home</a>
<script>(function(){var en=location.pathname.indexOf('/en')===0;if(!en){try{var v=localStorage.getItem('aa-lang');var l=String(navigator.language||'').toLowerCase();en=v?v==='en':!(l.indexOf('uz')===0||l.indexOf('ru')===0)}catch(e){en=true}}
if(!en){document.documentElement.lang='uz';document.getElementById('t').textContent='Bu sahifa mavjud emas yoki koʻchirilgan.';var b=document.getElementById('b');b.textContent='Bosh sahifaga qaytish';b.href='/'}})()</script>
